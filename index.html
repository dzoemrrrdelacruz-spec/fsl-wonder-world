<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FSL Wonder-World: LCD Optimized</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    
    <style>
        :root {
            --sky-blue: #4db8ff; --sunny-yellow: #ffdb4d; --grass-green: #5cd65c;
            --text-navy: #003366; --magic-purple: #a29bfe; --lava-orange: #ff7f50;
            --locked-gray: #dfe6e9; --bg-beginner: #e8f8f5; --border-beginner: #27ae60;
            --bg-inter: #ebf5fb; --border-inter: #2980b9; --bg-adv: #fdf2e9; --border-adv: #e67e22;
        }

        /* FIX 1: Allow scrolling on small LCDs */
        body, html {
            margin: 0; padding: 0; min-height: 100vh; width: 100vw;
            overflow-x: hidden; overflow-y: auto; 
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
            color: var(--text-navy);
        }

        .cloud { position: absolute; background: white; border-radius: 50px; opacity: 0.8; z-index: 1; animation: moveClouds linear infinite; }
        @keyframes moveClouds { from { left: -300px; } to { left: 100vw; } }
        .island-bg { position: absolute; bottom: 0; width: 100%; height: 200px; background: linear-gradient(to top, #2ecc71 0%, #27ae60 100%); border-radius: 50% 50% 0 0; z-index: 0; }

        header { 
            position: sticky; top: 0; z-index: 100; background: white; 
            padding: 10px; border-bottom: 5px solid var(--sunny-yellow); 
            display: flex; align-items: center; justify-content: space-between;
        }
        header h1 { font-family: 'Fredoka One'; font-size: 1.5rem; color: var(--sky-blue); margin: 0; }

        .screen { 
            display: none; padding: 20px; box-sizing: border-box; 
            width: 100%; min-height: calc(100vh - 80px); 
            position: relative; z-index: 15; flex-direction: column; align-items: center;
        }
        .screen.active { display: flex; }

        /* FIX 2: Responsive Grid for Level Cards */
        .level-hub { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; width: 100%; max-width: 1000px; margin-top: 20px;
        }
        .level-card { 
            background: white; border-radius: 30px; padding: 15px; 
            text-align: center; border: 5px solid white; transition: 0.3s;
        }
        #card-beginner { background: var(--bg-beginner); box-shadow: 0 8px 0 var(--border-beginner); }
        #card-intermediate { background: var(--bg-inter); box-shadow: 0 8px 0 var(--border-inter); }
        #card-advanced { background: var(--bg-adv); box-shadow: 0 8px 0 var(--border-adv); }

        /* FIX 3: Smaller Camera for small LCDs */
        .cam-window { 
            background: white; border-radius: 30px; padding: 15px; 
            width: 95%; max-width: 500px; border: 6px solid var(--sky-blue);
        }
        #webcam-container { 
            width: 300px; height: 300px; background: #000; 
            border-radius: 20px; margin: 10px auto; border: 5px solid #333; 
            overflow: hidden;
        }
        #webcam-container canvas { width: 100% !important; height: auto !important; }

        /* FIX 4: Training Layout for small screens */
        .app-window { 
            background: white; border-radius: 30px; width: 100%; 
            max-width: 1100px; border: 5px solid white; display: flex; flex-direction: column;
        }
        .training-grid { 
            display: grid; grid-template-columns: 1fr; gap: 15px; padding: 15px; 
        }
        @media (min-width: 800px) { .training-grid { grid-template-columns: 1.5fr 1fr; } }

        .video-tv { background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16/9; }
        
        .module-btn { 
            background: white; border: 3px solid var(--sky-blue); padding: 12px 20px; 
            border-radius: 20px; font-family: 'Fredoka One'; font-size: 1.1rem; 
            cursor: pointer; box-shadow: 0 5px 0 var(--sky-blue); margin: 5px;
        }

        #capture-status { font-family: 'Fredoka One'; font-size: 1.5rem; padding: 10px; min-height: 40px; border-radius: 15px; }

        .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
    </style>
</head>
<body>

    <header>
        <div onclick="askConfirmBack()" style="font-size: 40px; cursor: pointer;">🦁</div>
        <h1 onclick="askConfirmBack()">FSL Wonder-World</h1>
        <div onclick="openGallery()" style="font-size: 30px; cursor: pointer;">🏆</div>
    </header>

    <div id="welcome" class="screen active">
        <div style="font-size: 120px; margin: 20px 0;">🗺️</div>
        <button class="module-btn" style="font-size: 2rem; padding: 20px 50px; background: var(--grass-green); color: white; border: none; box-shadow: 0 8px 0 #3d8b3d;" onclick="goToDashboard()">LET'S GO!</button>
    </div>

    <div id="dashboard" class="screen">
        <div class="level-hub">
            <div class="level-card" id="card-beginner" onclick="previewLevel('beginner')">
                <div style="font-size:50px">🏔️</div>
                <h3>BEGINNER</h3>
            </div>
            <div class="level-card" id="card-intermediate" onclick="previewLevel('intermediate')">
                <div style="font-size:50px">🌊</div>
                <h3>INTERMEDIATE</h3>
            </div>
            <div class="level-card" id="card-advanced" onclick="previewLevel('advanced')">
                <div style="font-size:50px">🚀</div>
                <h3>ADVANCED</h3>
            </div>
        </div>
        
        <div id="moduleSelectionArea" style="display:none; width: 100%; text-align: center;">
            <h2 id="currentLevelLabel">Missions</h2>
            <div id="moduleList"></div>
            <button class="module-btn" style="border-color:#ccc; box-shadow:0 5px 0 #ccc;" onclick="resetToLevelSelection()">◀ CHANGE LEVEL</button>
        </div>

        <div style="margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center;">
            <button class="module-btn" style="background: var(--magic-purple); color: white;" onclick="openCameraMode()">📷 SIGNING CAMERA</button>
            <button class="module-btn" style="border-color:#ccc;" onclick="askConfirmBack()">◀ BACK</button>
        </div>
    </div>

    <div id="captureMode" class="screen">
        <div class="cam-window">
            <h2 style="font-family:'Fredoka One'; margin:0;">SIGN CAPTURE</h2>
            <div id="webcam-container"></div>
            <div id="capture-status">No captured gesture</div>
            <button class="module-btn" style="background:var(--lava-orange); color:white; border:none;" onclick="closeCameraMode()">CLOSE</button>
        </div>
    </div>

    <div id="module" class="screen">
        <div class="app-window">
            <div class="training-grid">
                <div>
                    <div class="video-tv"><video id="videoPlayer" controls style="width:100%; height:100%;"></video></div>
                    <h3 id="moduleTitle" style="text-align:center;">Lesson</h3>
                </div>
                <div style="background: #f8fbff; border-radius: 20px; padding: 10px; max-height: 300px; overflow-y: auto;">
                    <div id="videoList"></div>
                    <button id="assessmentBtn" class="module-btn" style="width:90%; background:var(--locked-gray); cursor:not-allowed;">QUIZ ⭐</button>
                </div>
            </div>
            <button class="module-btn" onclick="showScreen('dashboard')">◀ MAP</button>
        </div>
    </div>

    <div id="gallery" class="screen">
        <div class="cam-window">
            <h2 style="font-family:'Fredoka One';">🏆 BADGES</h2>
            <div class="badge-grid" id="badgeGrid"></div>
            <button class="module-btn" onclick="showScreen('dashboard')">CLOSE</button>
        </div>
    </div>

    <div id="mainPopup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
        <div id="popupContent" style="background:white; padding:20px; border-radius:20px; text-align:center; width:80%;"></div>
    </div>

<script>
    const DATA = {
        beginner: { titles: { 1: "Alphabet ABCs", 2: "Numbers 1-10", 3: "Basic Words" }, videoCounts: { 1: 27, 2: 10, 3: 10 } },
        intermediate: { titles: { 1: "Emotions", 2: "Greetings", 3: "Polite Expressions" }, videoCounts: { 1: 10, 2: 10, 3: 10 } },
        advanced: { titles: { 1: "Basic Phrases" }, videoCounts: { 1: 10 } }
    };

    let state = { level: null, currentModule: null, watchedItems: new Set() };
    let model, webcam, isCamActive = false;

    // CAPTURE ENGINE
    async function openCameraMode() {
        showScreen('captureMode');
        document.getElementById('capture-status').innerText = "⌛ LOADING...";
        try {
            if(!model) model = await tmImage.load("./model.json", "./metadata.json");
            if(!webcam) {
                // Resolution adjusted for RPi performance and LCD size
                webcam = new tmImage.Webcam(300, 300, true);
                await webcam.setup();
                document.getElementById("webcam-container").appendChild(webcam.canvas);
            }
            await webcam.play();
            isCamActive = true;
            loop();
        } catch(e) { alert("Camera failed"); closeCameraMode(); }
    }

    async function loop() {
        if(!isCamActive) return;
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        const status = document.getElementById('capture-status');
        let best = { className: "", probability: 0 };
        prediction.forEach(p => { if(p.probability > best.probability) best = p; });

        // 70-80% ACCURACY RULE
        if(best.probability >= 0.70 && best.className !== "NO DETECTION") {
            status.innerText = "Captured: " + best.className;
            status.style.background = "var(--grass-green)";
            status.style.color = "white";
        } else {
            status.innerText = "No captured gesture";
            status.style.background = "none";
            status.style.color = "var(--text-navy)";
        }
    }

    function closeCameraMode() { isCamActive = false; if(webcam) webcam.stop(); showScreen('dashboard'); }

    // NAVIGATION
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function goToDashboard() { showScreen('dashboard'); }

    function previewLevel(lvl) {
        state.level = lvl;
        document.querySelector('.level-hub').style.display = 'none';
        const modArea = document.getElementById('moduleSelectionArea');
        const list = document.getElementById('moduleList');
        modArea.style.display = 'block';
        list.innerHTML = "";
        document.getElementById('currentLevelLabel').innerText = lvl.toUpperCase();
        Object.keys(DATA[lvl].titles).forEach(mId => {
            const btn = document.createElement("button");
            btn.className = "module-btn";
            btn.innerText = DATA[lvl].titles[mId];
            btn.onclick = () => startTraining(mId);
            list.appendChild(btn);
        });
    }

    function resetToLevelSelection() {
        document.querySelector('.level-hub').style.display = 'grid';
        document.getElementById('moduleSelectionArea').style.display = 'none';
    }

    function startTraining(m) {
        state.currentModule = m;
        showScreen('module');
        document.getElementById("moduleTitle").innerText = DATA[state.level].titles[m];
        const list = document.getElementById("videoList"); list.innerHTML = "";
        const count = DATA[state.level].videoCounts[m];
        for(let i=1; i<=count; i++) {
            const item = document.createElement("div");
            item.style = "padding:10px; border-bottom:1px solid #eee; cursor:pointer;";
            item.innerHTML = `Lesson ${i} ⭐`;
            item.onclick = () => {
                const folder = state.level === 'advanced' ? 'hard' : state.level;
                document.getElementById("videoPlayer").src = `videos/${folder}/module${m}_video${i}.mp4`;
                document.getElementById("videoPlayer").play();
            };
            list.appendChild(item);
        }
    }

    function openGallery() {
        showScreen('gallery');
        const grid = document.getElementById("badgeGrid");
        grid.innerHTML = "<p>Complete lessons to earn badges!</p>";
    }

    function askConfirmBack() { if(confirm("Go back?")) showScreen('welcome'); }
</script>
</body>
</html>
