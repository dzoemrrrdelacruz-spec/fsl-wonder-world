<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FSL Wonder-World: Magical Adventure & Sign Capture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    
    <style>
        :root {
            --sky-blue: #4db8ff; --sunny-yellow: #ffdb4d; --grass-green: #5cd65c;
            --soft-white: #ffffff; --text-navy: #003366; --magic-purple: #a29bfe;
            --lava-orange: #ff7f50; --locked-gray: #dfe6e9;
            --bg-beginner: #e8f8f5; --border-beginner: #27ae60;
            --bg-inter: #ebf5fb; --border-inter: #2980b9;
            --bg-adv: #fdf2e9; --border-adv: #e67e22;
        }

        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            overflow: hidden; font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
            color: var(--text-navy);
        }

        .cloud { position: absolute; background: white; border-radius: 50px; opacity: 0.8; z-index: 1; animation: moveClouds linear infinite; }
        @keyframes moveClouds { from { left: -300px; } to { left: 100vw; } }
        .island-bg { position: absolute; bottom: 0; width: 100%; height: 28vh; background: linear-gradient(to top, #2ecc71 0%, #27ae60 100%); border-radius: 50% 50% 0 0; z-index: 0; }
        .water { position: absolute; bottom: 0; width: 100%; height: 12vh; background: rgba(0, 168, 255, 0.4); z-index: 3; pointer-events: none; }

        .leo-chibi { font-size: 100px; display: inline-block; animation: leoBounce 2.5s infinite ease-in-out; cursor: pointer; }
        @keyframes leoBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        header { position: relative; z-index: 20; background: white; padding: 15px 0; border-bottom: 8px solid var(--sunny-yellow); text-align: center; border-radius: 0 0 40px 40px; display: flex; align-items: center; justify-content: center; gap: 20px; }
        header h1 { font-family: 'Fredoka One'; font-size: 2.5rem; margin: 0; color: var(--sky-blue); cursor: pointer; }

        .trophy-btn { position: absolute; right: 30px; top: 20px; font-size: 40px; cursor: pointer; z-index: 100; }

        .screen { display: none; height: calc(100vh - 120px); width: 100%; position: relative; z-index: 15; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .screen.active { display: flex; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- DASHBOARD --- */
        .level-hub { display: flex; gap: 25px; width: 95%; max-width: 1200px; justify-content: center; margin-bottom: 30px; }
        .level-card { flex: 1; border-radius: 45px; padding: 30px 20px; text-align: center; cursor: pointer; border: 8px solid white; transition: 0.3s; }
        #card-beginner { background: var(--bg-beginner); box-shadow: 0 12px 0 var(--border-beginner); }
        #card-intermediate { background: var(--bg-inter); box-shadow: 0 12px 0 var(--border-inter); }
        #card-advanced { background: var(--bg-adv); box-shadow: 0 12px 0 var(--border-adv); }
        .progress-container { width: 100%; background: rgba(255,255,255,0.5); border-radius: 15px; height: 18px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.6s ease; }

        /* --- CAPTURE SCREEN --- */
        .cam-window { background: white; border-radius: 50px; padding: 30px; width: 90%; max-width: 800px; text-align: center; border: 10px solid var(--sky-blue); box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        #webcam-container { width: 448px; height: 448px; background: #000; border-radius: 30px; margin: 20px auto; border: 10px solid #333; overflow: hidden; }
        #capture-status { font-family: 'Fredoka One'; font-size: 2.2rem; color: var(--text-navy); margin-top: 15px; padding: 10px; border-radius: 20px; min-height: 60px; }

        /* --- BUTTONS --- */
        .module-btn { background: white; border: 4px solid var(--sky-blue); padding: 15px 35px; border-radius: 25px; font-family: 'Fredoka One'; font-size: 1.4rem; cursor: pointer; box-shadow: 0 8px 0 var(--sky-blue); margin: 10px; }
        .btn-lets-go { background: var(--grass-green); color: white; font-family: 'Fredoka One'; font-size: 3.5rem; padding: 25px 80px; border: none; border-radius: 40px; box-shadow: 0 12px 0 #3d8b3d; cursor: pointer; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 300; align-items: center; justify-content: center; }
        .popup { background: white; padding: 40px; border-radius: 40px; border: 8px solid var(--sunny-yellow); text-align: center; max-width: 450px; animation: popIn 0.3s ease; }

        .app-window { background: rgba(255,255,255,0.98); border-radius: 50px; height: 95%; width: 95%; max-width: 1200px; display: flex; flex-direction: column; border: 10px solid white; position: relative; z-index: 50; }
        .video-tv { background: #000; border: 10px solid var(--sky-blue); border-radius: 35px; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="cloud" style="width:250px; height:70px; top:15%; animation-duration: 25s;"></div>
    <div class="island-bg"></div>
    <div class="water"></div>

    <div id="mainPopup" class="overlay"><div class="popup" id="popupContent"></div></div>

    <header>
        <div class="leo-chibi" style="font-size: 60px;" onclick="askConfirmBack()">🦁</div>
        <h1 onclick="askConfirmBack()">FSL Wonder-World</h1>
        <div class="trophy-btn" onclick="openGallery()">🏆</div>
    </header>

    <div id="welcome" class="screen active">
        <div style="font-size: 220px; margin-bottom: 30px;">🗺️</div>
        <button class="btn-lets-go" onclick="goToDashboard()">LET'S GO!</button>
    </div>

    <div id="dashboard" class="screen">
        <div class="level-hub">
            <div class="level-card" id="card-beginner" onclick="previewLevel('beginner')">
                <div style="font-size:80px">🏔️</div>
                <h3>BEGINNER</h3>
                <div class="progress-container"><div id="prog-beginner" class="progress-bar" style="background:var(--border-beginner)"></div></div>
            </div>
            <div class="level-card" id="card-intermediate" onclick="previewLevel('intermediate')">
                <div style="font-size:80px">🌊</div>
                <h3>INTERMEDIATE</h3>
                <div class="progress-container"><div id="prog-intermediate" class="progress-bar" style="background:var(--border-inter)"></div></div>
            </div>
            <div class="level-card" id="card-advanced" onclick="previewLevel('advanced')">
                <div style="font-size:80px">🚀</div>
                <h3>ADVANCED</h3>
                <div class="progress-container"><div id="prog-advanced" class="progress-bar" style="background:var(--border-adv)"></div></div>
            </div>
        </div>
        
        <div id="moduleSelectionArea" style="display:none; flex-direction:column; align-items:center;">
            <h2 id="currentLevelLabel" style="font-family:'Fredoka One'; color: var(--text-navy);">Select a Mission</h2>
            <div id="moduleList" style="display:flex; flex-wrap:wrap; justify-content:center;"></div>
            <button class="module-btn" style="border-color:#ccc; box-shadow:0 8px 0 #ccc;" onclick="resetToLevelSelection()">◀ CHANGE LEVEL</button>
        </div>

        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button id="cameraAccessBtn" class="module-btn" style="background: var(--magic-purple); color: white; border-color: #8a81f3; box-shadow: 0 8px 0 #6c5ce7;" onclick="openCameraMode()">📷 SIGNING CAMERA</button>
            <button id="backToStartBtn" class="module-btn" style="border-color:#ccc; box-shadow:0 8px 0 #ccc;" onclick="askConfirmBack()">◀ BACK TO START</button>
        </div>
    </div>

    <div id="captureMode" class="screen">
        <div class="cam-window">
            <h2 style="font-family:'Fredoka One'; color:var(--sky-blue); margin:0;">SIGN CAPTURE</h2>
            <div id="webcam-container"></div>
            <div id="capture-status">No captured gesture</div>
            <button class="module-btn" style="background:var(--lava-orange); color:white; border:none; box-shadow:0 8px 0 #d35400;" onclick="closeCameraMode()">CLOSE CAMERA</button>
        </div>
    </div>

    <div id="module" class="screen">
        <div class="app-window">
            <div style="padding: 15px; border-bottom: 2px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                <button onclick="showScreen('dashboard')" style="background:var(--sky-blue); color:white; border:none; padding:12px 25px; border-radius:15px; font-family:'Fredoka One'; cursor:pointer;">◀ MAP</button>
                <h2 id="moduleTitle" style="font-family:'Fredoka One'; margin:0; color: var(--sky-blue);">Lesson</h2>
                <div class="leo-chibi" style="font-size: 50px;" onclick="startQuiz()">🦁</div>
            </div>
            <div style="display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; padding: 25px; flex: 1; overflow: hidden;">
                <div><div class="video-tv"><video id="videoPlayer" controls style="width:100%; height:100%;"></video></div></div>
                <div style="background: #f8fbff; border-radius: 35px; padding: 20px; display: flex; flex-direction: column; overflow: hidden; border: 3px solid #eee;">
                    <div id="videoList" style="overflow-y: auto; flex: 1;"></div>
                    <button id="assessmentBtn" style="background: var(--locked-gray); color:white; border:none; padding:20px; border-radius:25px; font-family:'Fredoka One'; cursor:not-allowed;">WATCH ALL LESSONS ⭐</button>
                </div>
            </div>
        </div>
    </div>

    <div id="assessment" class="screen"></div>
    <div id="gallery" class="screen"></div>

<script>
    const DATA = {
        beginner: { titles: { 1: "Alphabet ABCs", 2: "Numbers 1-10", 3: "Basic Words" }, videoCounts: { 1: 27, 2: 10, 3: 10 } },
        intermediate: { titles: { 1: "Emotions", 2: "Greetings", 3: "Polite Expressions" }, videoCounts: { 1: 10, 2: 10, 3: 10 } },
        advanced: { titles: { 1: "Basic Phrases" }, videoCounts: { 1: 10 } }
    };

    let state = { level: null, currentModule: null, watchedItems: new Set() };
    let model, webcam, isCamActive = false;

    async function openCameraMode() {
        showScreen('captureMode');
        const status = document.getElementById('capture-status');
        status.innerText = "⌛ LOADING MODEL...";
        try {
            if(!model) model = await tmImage.load("./model.json", "./metadata.json");
            if(!webcam) {
                webcam = new tmImage.Webcam(448, 448, true);
                await webcam.setup();
                document.getElementById("webcam-container").appendChild(webcam.canvas);
            }
            await webcam.play();
            isCamActive = true;
            window.requestAnimationFrame(loopCapture);
        } catch(e) { alert("Camera or Model error."); closeCameraMode(); }
    }

    async function loopCapture() {
        if(!isCamActive) return;
        webcam.update();
        await predict();
        window.requestAnimationFrame(loopCapture);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        const status = document.getElementById('capture-status');
        let best = { className: "", probability: 0 };
        prediction.forEach(p => { if(p.probability > best.probability) best = p; });

        // REWORKED LOGIC: Only show capture if accuracy is >= 70%
        if(best.probability >= 0.70 && best.className !== "NO DETECTION") {
            status.innerText = "Captured: " + best.className;
            status.style.background = "var(--grass-green)";
            status.style.color = "white";
        } else {
            status.innerText = "No captured gesture";
            status.style.background = "none";
            status.style.color = "var(--text-navy)";
        }
    }

    function closeCameraMode() { isCamActive = false; if(webcam) webcam.stop(); showScreen('dashboard'); }

    // --- NAVIGATION ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'dashboard') resetToLevelSelection();
    }

    function goToDashboard() { showScreen('dashboard'); }

    function previewLevel(lvl) {
        state.level = lvl;
        document.querySelector('.level-hub').style.display = 'none';
        document.getElementById('backToStartBtn').style.display = 'none';
        document.getElementById('cameraAccessBtn').style.display = 'none';
        const modArea = document.getElementById('moduleSelectionArea');
        const list = document.getElementById('moduleList');
        modArea.style.display = 'flex';
        list.innerHTML = "";
        document.getElementById('currentLevelLabel').innerText = lvl.toUpperCase() + " MISSIONS";
        Object.keys(DATA[lvl].titles).forEach(mId => {
            const btn = document.createElement("button");
            btn.className = "module-btn";
            btn.innerText = DATA[lvl].titles[mId];
            btn.onclick = () => startTraining(mId);
            list.appendChild(btn);
        });
    }

    function resetToLevelSelection() {
        document.querySelector('.level-hub').style.display = 'flex';
        document.getElementById('backToStartBtn').style.display = 'block';
        document.getElementById('cameraAccessBtn').style.display = 'block';
        document.getElementById('moduleSelectionArea').style.display = 'none';
    }

    function startTraining(m) {
        state.currentModule = m;
        state.watchedItems = new Set();
        showScreen('module');
        document.getElementById("moduleTitle").innerText = DATA[state.level].titles[m];
        const list = document.getElementById("videoList"); list.innerHTML = "";
        const count = DATA[state.level].videoCounts[m];
        for(let i=1; i<=count; i++) {
            const card = document.createElement("div");
            card.style = "background:white; border-radius:15px; margin-bottom:10px; padding:15px; display:flex; justify-content:space-between; border:3px solid #eee; cursor:pointer;";
            card.innerHTML = `<span>Lesson ${i}</span> <span class='status-icon'>⚪</span>`;
            card.onclick = function() {
                const folder = state.level === 'advanced' ? 'hard' : state.level;
                // Ensure paths are lowercase for GitHub compatibility
                document.getElementById("videoPlayer").src = `videos/${folder}/module${m}_video${i}.mp4`;
                document.getElementById("videoPlayer").play();
                this.querySelector('.status-icon').innerText = "⭐";
            };
            list.appendChild(card);
        }
    }

    function askConfirmBack() { if(confirm("Go back to start?")) showScreen('welcome'); }
</script>
</body>
</html>
