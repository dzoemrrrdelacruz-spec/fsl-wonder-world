<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FSL Wonder-World: Adventure & Sign Capture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    
    <style>
        :root {
            --sky-blue: #4db8ff; --sunny-yellow: #ffdb4d; --grass-green: #5cd65c;
            --text-navy: #003366; --magic-purple: #a29bfe; --lava-orange: #ff7f50;
            --locked-gray: #dfe6e9; --bg-beginner: #e8f8f5; --border-beginner: #27ae60;
            --bg-inter: #ebf5fb; --border-inter: #2980b9; --bg-adv: #fdf2e9; --border-adv: #e67e22;
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh; width: 100vw;
            overflow-x: hidden; overflow-y: auto; 
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
            color: var(--text-navy);
        }

        header { 
            position: sticky; top: 0; z-index: 100; background: white; 
            padding: 10px; border-bottom: 5px solid var(--sunny-yellow); 
            display: flex; align-items: center; justify-content: space-between;
        }
        header h1 { font-family: 'Fredoka One'; font-size: 1.2rem; color: var(--sky-blue); margin: 0; }

        .screen { 
            display: none; padding: 15px; box-sizing: border-box; 
            width: 100%; min-height: calc(100vh - 80px); 
            position: relative; z-index: 15; flex-direction: column; align-items: center;
        }
        .screen.active { display: flex; }

        /* Level Cards */
        .level-hub { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; width: 100%; max-width: 1000px; margin-top: 20px;
        }
        .level-card { 
            background: white; border-radius: 25px; padding: 20px; 
            text-align: center; border: 5px solid white; cursor: pointer;
        }
        
        /* Training & Quiz Layouts */
        .app-window { 
            background: white; border-radius: 30px; width: 100%; 
            max-width: 1100px; border: 5px solid white; display: flex; flex-direction: column;
        }
        .training-grid { 
            display: grid; grid-template-columns: 1fr; gap: 15px; padding: 15px; 
        }
        @media (min-width: 800px) { .training-grid { grid-template-columns: 1.5fr 1fr; } }

        .video-tv { background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16/9; }
        
        .module-btn { 
            background: white; border: 3px solid var(--sky-blue); padding: 12px 20px; 
            border-radius: 20px; font-family: 'Fredoka One'; font-size: 1.1rem; 
            cursor: pointer; box-shadow: 0 5px 0 var(--sky-blue); margin: 5px;
        }

        .lesson-item {
            padding: 12px; border-radius: 15px; border: 2px solid #eee; margin-bottom: 8px;
            display: flex; justify-content: space-between; background: white; font-weight: bold;
        }
        .lesson-item.watched { border-color: var(--grass-green); background: #f0fff0; }

        #assessmentBtn.ready { background: var(--sunny-yellow); box-shadow: 0 5px 0 #d4af37; color: var(--text-navy); }

        /* Quiz Specifics */
        .quiz-input {
            width: 80%; padding: 15px; border-radius: 20px; border: 4px solid var(--sky-blue);
            font-size: 1.5rem; font-family: 'Fredoka One'; text-align: center; margin: 15px 0;
        }
    </style>
</head>
<body>

    <header>
        <button class="module-btn" style="padding: 5px 10px; font-size: 0.8rem;" onclick="askConfirmBack()">HOME</button>
        <h1>FSL WONDER-WORLD</h1>
        <div style="width: 50px;"></div>
    </header>

    <div id="welcome" class="screen active">
        <h1 style="font-family: 'Fredoka One'; font-size: 2.5rem; text-align:center;">ADVENTURE START</h1>
        <button class="module-btn" style="font-size: 1.8rem; padding: 20px; background: var(--grass-green); color: white; border: none;" onclick="goToDashboard()">LET'S GO</button>
    </div>

    <div id="dashboard" class="screen">
        <div class="level-hub">
            <div class="level-card" id="card-beginner" onclick="previewLevel('beginner')"><h3>BEGINNER</h3></div>
            <div class="level-card" id="card-intermediate" onclick="previewLevel('intermediate')"><h3>INTERMEDIATE</h3></div>
            <div class="level-card" id="card-advanced" onclick="previewLevel('advanced')"><h3>ADVANCED</h3></div>
        </div>
        <div id="moduleSelectionArea" style="display:none; text-align: center; width: 100%;">
            <h2 id="currentLevelLabel">MISSIONS</h2>
            <div id="moduleList"></div>
            <button class="module-btn" style="border-color:#ccc; box-shadow:0 5px 0 #ccc;" onclick="resetToLevelSelection()">BACK TO LEVELS</button>
        </div>
        <button class="module-btn" style="background: var(--magic-purple); color: white; margin-top:20px;" onclick="openCameraMode()">OPEN SIGNING CAMERA</button>
    </div>

    <div id="module" class="screen">
        <div class="app-window">
            <div style="padding: 10px; display: flex; justify-content: space-between; align-items: center;">
                <button class="module-btn" style="font-size: 0.8rem;" onclick="showScreen('dashboard')">MAP</button>
                <h2 id="moduleTitle" style="font-size: 1rem; color: var(--sky-blue);">LESSON</h2>
                <div style="width: 50px;"></div>
            </div>
            <div class="training-grid">
                <div><div class="video-tv"><video id="videoPlayer" controls style="width:100%; height:100%;"></video></div></div>
                <div style="background: #f8fbff; border-radius: 20px; padding: 10px; max-height: 250px; overflow-y: auto;">
                    <div id="videoList"></div>
                    <button id="assessmentBtn" class="module-btn" style="width:100%; background:var(--locked-gray); color: #888;" disabled>LOCKED</button>
                </div>
            </div>
        </div>
    </div>

    <div id="assessment" class="screen">
        <div class="app-window" style="padding: 20px; text-align: center;">
            <h2 style="font-family:'Fredoka One';">QUIZ TIME</h2>
            <div class="video-tv" style="max-width: 600px; margin: 0 auto;">
                <video id="quizVideo" controls style="width:100%; height:100%;"></video>
            </div>
            <p>What sign is being shown?</p>
            <input type="text" id="quizInput" class="quiz-input" placeholder="Type here...">
            <br>
            <button class="module-btn" style="background: var(--grass-green); color: white; width: 80%;" onclick="checkAnswer()">SUBMIT ANSWER</button>
            <button class="module-btn" style="border-color:#ccc;" onclick="showScreen('module')">BACK TO LESSON</button>
        </div>
    </div>

    <div id="captureMode" class="screen">
        <div class="app-window" style="padding: 20px; text-align: center;">
            <h2>SIGN CAPTURE</h2>
            <div id="webcam-container" style="width:280px; height:280px; margin: 0 auto; background:#000; border-radius: 20px; overflow:hidden;"></div>
            <div id="capture-status" style="margin: 15px; font-weight: bold;">READY</div>
            <button class="module-btn" style="background:var(--lava-orange); color:white;" onclick="closeCameraMode()">CLOSE</button>
        </div>
    </div>

<script>
    const DATA = {
        beginner: { titles: { 1: "Alphabet ABCs", 2: "Numbers 1-10", 3: "Basic Words" }, videoCounts: { 1: 27, 2: 10, 3: 10 } },
        intermediate: { titles: { 1: "Emotions", 2: "Greetings", 3: "Polite Expressions" }, videoCounts: { 1: 10, 2: 10, 3: 10 } },
        advanced: { titles: { 1: "Basic Phrases" }, videoCounts: { 1: 10 } }
    };

    let state = { level: null, currentModule: null, watchedItems: new Set() };
    let model, webcam, isCamActive = false;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function goToDashboard() { showScreen('dashboard'); }

    function previewLevel(lvl) {
        state.level = lvl;
        document.querySelector('.level-hub').style.display = 'none';
        const modArea = document.getElementById('moduleSelectionArea');
        modArea.style.display = 'block';
        const list = document.getElementById('moduleList');
        list.innerHTML = "";
        Object.keys(DATA[lvl].titles).forEach(mId => {
            const btn = document.createElement("button");
            btn.className = "module-btn";
            btn.innerText = DATA[lvl].titles[mId];
            btn.onclick = () => startTraining(mId);
            list.appendChild(btn);
        });
    }

    function resetToLevelSelection() {
        document.querySelector('.level-hub').style.display = 'grid';
        document.getElementById('moduleSelectionArea').style.display = 'none';
    }

    function startTraining(m) {
        state.currentModule = m;
        state.watchedItems = new Set();
        showScreen('module');
        
        const qBtn = document.getElementById("assessmentBtn");
        qBtn.disabled = true;
        qBtn.innerText = "WATCH ALL LESSONS";
        qBtn.classList.remove("ready");
        qBtn.style.background = "var(--locked-gray)";

        document.getElementById("moduleTitle").innerText = DATA[state.level].titles[m];
        const list = document.getElementById("videoList"); 
        list.innerHTML = "";
        
        const count = DATA[state.level].videoCounts[m];
        for(let i=1; i<=count; i++) {
            const item = document.createElement("div");
            item.className = "lesson-item";
            item.id = `lesson-${i}`;
            item.innerHTML = `<span>LESSON ${i}</span> <span class="st">UNWATCHED</span>`;
            item.onclick = () => {
                const folder = state.level === 'advanced' ? 'hard' : state.level;
                document.getElementById("videoPlayer").src = `videos/${folder}/module${m}_video${i}.mp4`;
                document.getElementById("videoPlayer").play();
                state.watchedItems.add(i);
                item.classList.add("watched");
                item.querySelector(".st").innerText = "COMPLETED";
                checkProgress(count);
            };
            list.appendChild(item);
        }
    }

    function checkProgress(total) {
        const qBtn = document.getElementById("assessmentBtn");
        if(state.watchedItems.size >= total) {
            qBtn.disabled = false;
            qBtn.innerText = "START QUIZ NOW";
            qBtn.classList.add("ready");
            qBtn.onclick = () => {
                const folder = state.level === 'advanced' ? 'hard' : state.level;
                // Load the first quiz video (Example: module1_test1.mp4)
                document.getElementById("quizVideo").src = `videos/${folder}/module${state.currentModule}_test1.mp4`;
                showScreen('assessment');
                document.getElementById("quizVideo").play();
            };
        } else {
            qBtn.innerText = `${state.watchedItems.size}/${total} WATCHED`;
        }
    }

    function checkAnswer() {
        const input = document.getElementById("quizInput").value.toLowerCase();
        if(input.trim() !== "") {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            alert("CORRECT! MISSION COMPLETE.");
            showScreen('dashboard');
        } else {
            alert("PLEASE TYPE AN ANSWER.");
        }
    }

    // Camera Logic
    async function openCameraMode() {
        showScreen('captureMode');
        try {
            if(!model) model = await tmImage.load("./model.json", "./metadata.json");
            if(!webcam) {
                webcam = new tmImage.Webcam(280, 280, true);
                await webcam.setup();
                document.getElementById("webcam-container").appendChild(webcam.canvas);
            }
            webcam.play();
            isCamActive = true;
            loop();
        } catch(e) { alert("Camera failed."); closeCameraMode(); }
    }

    async function loop() {
        if(!isCamActive) return;
        webcam.update();
        const pred = await model.predict(webcam.canvas);
        let best = { className: "", probability: 0 };
        pred.forEach(p => { if(p.probability > best.probability) best = p; });
        const status = document.getElementById('capture-status');
        if(best.probability >= 0.70 && best.className !== "NO DETECTION") {
            status.innerText = "CAPTURED: " + best.className;
        } else {
            status.innerText = "SEARCHING...";
        }
        window.requestAnimationFrame(loop);
    }

    function closeCameraMode() { isCamActive = false; if(webcam) webcam.stop(); showScreen('dashboard'); }
    function askConfirmBack() { if(confirm("HOME?")) showScreen('welcome'); }
</script>
</body>
</html>
