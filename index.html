<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FSL Wonder-World: LCD Optimized</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    
    <style>
        :root {
            --sky-blue: #4db8ff; --sunny-yellow: #ffdb4d; --grass-green: #5cd65c;
            --text-navy: #003366; --magic-purple: #a29bfe; --lava-orange: #ff7f50;
            --locked-gray: #dfe6e9; --bg-beginner: #e8f8f5; --border-beginner: #27ae60;
            --bg-inter: #ebf5fb; --border-inter: #2980b9; --bg-adv: #fdf2e9; --border-adv: #e67e22;
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh; width: 100vw;
            overflow-x: hidden; overflow-y: auto; 
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
            color: var(--text-navy);
        }

        header { 
            position: sticky; top: 0; z-index: 100; background: white; 
            padding: 10px; border-bottom: 5px solid var(--sunny-yellow); 
            display: flex; align-items: center; justify-content: space-between;
        }
        header h1 { font-family: 'Fredoka One'; font-size: 1.5rem; color: var(--sky-blue); margin: 0; }

        .screen { 
            display: none; padding: 15px; box-sizing: border-box; 
            width: 100%; min-height: calc(100vh - 80px); 
            position: relative; z-index: 15; flex-direction: column; align-items: center;
        }
        .screen.active { display: flex; }

        .level-hub { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; width: 100%; max-width: 1000px; margin-top: 10px;
        }
        .level-card { 
            background: white; border-radius: 25px; padding: 15px; 
            text-align: center; border: 5px solid white; transition: 0.3s;
        }
        #card-beginner { background: var(--bg-beginner); box-shadow: 0 8px 0 var(--border-beginner); }
        #card-intermediate { background: var(--bg-inter); box-shadow: 0 8px 0 var(--border-inter); }
        #card-advanced { background: var(--bg-adv); box-shadow: 0 8px 0 var(--border-adv); }

        .cam-window { 
            background: white; border-radius: 30px; padding: 15px; 
            width: 95%; max-width: 500px; border: 6px solid var(--sky-blue);
        }
        #webcam-container { 
            width: 280px; height: 280px; background: #000; 
            border-radius: 20px; margin: 10px auto; border: 5px solid #333; 
            overflow: hidden;
        }
        #webcam-container canvas { width: 100% !important; height: auto !important; }

        .app-window { 
            background: white; border-radius: 30px; width: 100%; 
            max-width: 1100px; border: 5px solid white; display: flex; flex-direction: column;
        }
        .training-grid { 
            display: grid; grid-template-columns: 1fr; gap: 15px; padding: 15px; 
        }
        @media (min-width: 800px) { .training-grid { grid-template-columns: 1.5fr 1fr; } }

        .video-tv { background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16/9; }
        
        .module-btn { 
            background: white; border: 3px solid var(--sky-blue); padding: 12px 20px; 
            border-radius: 20px; font-family: 'Fredoka One'; font-size: 1.1rem; 
            cursor: pointer; box-shadow: 0 5px 0 var(--sky-blue); margin: 5px;
        }

        .lesson-item {
            padding: 12px; border-radius: 15px; border: 2px solid #eee; margin-bottom: 8px;
            display: flex; justify-content: space-between; cursor: pointer; background: white;
            font-weight: bold;
        }
        .lesson-item.watched { border-color: var(--grass-green); background: #f0fff0; }

        #assessmentBtn { width: 95%; transition: 0.3s; margin-top: 10px; }
        #assessmentBtn.ready { background: var(--sunny-yellow); box-shadow: 0 5px 0 #d4af37; cursor: pointer; color: var(--text-navy); }
    </style>
</head>
<body>

    <header>
        <div onclick="askConfirmBack()" style="font-size: 35px; cursor: pointer;">🦁</div>
        <h1 onclick="askConfirmBack()">FSL Wonder-World</h1>
        <div onclick="openGallery()" style="font-size: 30px; cursor: pointer;">🏆</div>
    </header>

    <div id="welcome" class="screen active">
        <div style="font-size: 100px; margin: 20px 0;">🗺️</div>
        <button class="module-btn" style="font-size: 1.8rem; background: var(--grass-green); color: white; border: none;" onclick="goToDashboard()">LET'S GO!</button>
    </div>

    <div id="dashboard" class="screen">
        <div class="level-hub">
            <div class="level-card" id="card-beginner" onclick="previewLevel('beginner')"><h3>🏔️ BEGINNER</h3></div>
            <div class="level-card" id="card-intermediate" onclick="previewLevel('intermediate')"><h3>🌊 INTER</h3></div>
            <div class="level-card" id="card-advanced" onclick="previewLevel('advanced')"><h3>🚀 ADVANCED</h3></div>
        </div>
        
        <div id="moduleSelectionArea" style="display:none; width: 100%; text-align: center;">
            <h2 id="currentLevelLabel">Missions</h2>
            <div id="moduleList"></div>
            <button class="module-btn" style="border-color:#ccc;" onclick="resetToLevelSelection()">◀ CHANGE LEVEL</button>
        </div>

        <div style="margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center;">
            <button class="module-btn" style="background: var(--magic-purple); color: white;" onclick="openCameraMode()">📷 SIGN CAMERA</button>
        </div>
    </div>

    <div id="captureMode" class="screen">
        <div class="cam-window">
            <h2 style="font-family:'Fredoka One'; margin:0;">SIGN CAPTURE</h2>
            <div id="webcam-container"></div>
            <div id="capture-status" style="font-family:'Fredoka One'; padding:10px; border-radius:15px;">No gesture</div>
            <button class="module-btn" style="background:var(--lava-orange); color:white;" onclick="closeCameraMode()">CLOSE</button>
        </div>
    </div>

    <div id="module" class="screen">
        <div class="app-window">
            <div class="training-grid">
                <div>
                    <div class="video-tv"><video id="videoPlayer" controls style="width:100%; height:100%;"></video></div>
                    <h3 id="moduleTitle" style="text-align:center; margin:10px 0;">Lesson</h3>
                </div>
                <div style="background: #f8fbff; border-radius: 20px; padding: 10px;">
                    <p style="font-size: 0.8rem; color: #888; margin: 0;">Tap each lesson to watch:</p>
                    <div id="videoList" style="max-height: 250px; overflow-y: auto;"></div>
                    <button id="assessmentBtn" class="module-btn" style="background:var(--locked-gray); color:#aaa;" disabled>LOCKED ⭐</button>
                </div>
            </div>
            <button class="module-btn" onclick="showScreen('dashboard')">◀ MAP</button>
        </div>
    </div>

<script>
    const DATA = {
        beginner: { titles: { 1: "Alphabet ABCs", 2: "Numbers 1-10", 3: "Basic Words" }, videoCounts: { 1: 27, 2: 10, 3: 10 } },
        intermediate: { titles: { 1: "Emotions", 2: "Greetings", 3: "Polite Expressions" }, videoCounts: { 1: 10, 2: 10, 3: 10 } },
        advanced: { titles: { 1: "Basic Phrases" }, videoCounts: { 1: 10 } }
    };

    let state = { level: null, currentModule: null, watchedItems: new Set() };
    let model, webcam, isCamActive = false;

    // UI NAVIGATION
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function goToDashboard() { showScreen('dashboard'); }

    function previewLevel(lvl) {
        state.level = lvl;
        document.querySelector('.level-hub').style.display = 'none';
        const modArea = document.getElementById('moduleSelectionArea');
        modArea.style.display = 'block';
        const list = document.getElementById('moduleList');
        list.innerHTML = "";
        document.getElementById('currentLevelLabel').innerText = lvl.toUpperCase();
        Object.keys(DATA[lvl].titles).forEach(mId => {
            const btn = document.createElement("button");
            btn.className = "module-btn";
            btn.innerText = DATA[lvl].titles[mId];
            btn.onclick = () => startTraining(mId);
            list.appendChild(btn);
        });
    }

    function resetToLevelSelection() {
        document.querySelector('.level-hub').style.display = 'grid';
        document.getElementById('moduleSelectionArea').style.display = 'none';
    }

    // TRAINING LOGIC
    function startTraining(m) {
        state.currentModule = m;
        state.watchedItems = new Set();
        showScreen('module');
        
        const quizBtn = document.getElementById("assessmentBtn");
        quizBtn.disabled = true;
        quizBtn.innerText = "LOCKED ⭐";
        quizBtn.classList.remove("ready");
        quizBtn.style.background = "var(--locked-gray)";

        document.getElementById("moduleTitle").innerText = DATA[state.level].titles[m];
        const list = document.getElementById("videoList"); 
        list.innerHTML = "";
        
        const count = DATA[state.level].videoCounts[m];
        for(let i=1; i<=count; i++) {
            const item = document.createElement("div");
            item.className = "lesson-item";
            item.id = `lesson-${i}`;
            item.innerHTML = `<span>Lesson ${i}</span> <span class="icon">⚪</span>`;
            item.onclick = () => playLesson(i, count);
            list.appendChild(item);
        }
    }

    function playLesson(num, total) {
        const folder = state.level === 'advanced' ? 'hard' : state.level;
        const player = document.getElementById("videoPlayer");
        player.src = `videos/${folder}/module${state.currentModule}_video${num}.mp4`;
        player.play();

        // Mark as watched immediately on click (better for RPi touchscreens)
        state.watchedItems.add(num);
        const item = document.getElementById(`lesson-${num}`);
        item.classList.add("watched");
        item.querySelector(".icon").innerText = "✅";

        checkProgress(total);
    }

    function checkProgress(total) {
        const quizBtn = document.getElementById("assessmentBtn");
        if(state.watchedItems.size >= total) {
            quizBtn.disabled = false;
            quizBtn.innerText = "START QUIZ! 🏆";
            quizBtn.classList.add("ready");
            quizBtn.style.background = "var(--sunny-yellow)";
            quizBtn.onclick = () => alert("Quiz Started! (Logic here)");
        } else {
            quizBtn.innerText = `${state.watchedItems.size}/${total} WATCHED`;
        }
    }

    // CAMERA LOGIC (70% Accuracy Rule)
    async function openCameraMode() {
        showScreen('captureMode');
        try {
            if(!model) model = await tmImage.load("./model.json", "./metadata.json");
            if(!webcam) {
                webcam = new tmImage.Webcam(280, 280, true);
                await webcam.setup();
                document.getElementById("webcam-container").appendChild(webcam.canvas);
            }
            await webcam.play();
            isCamActive = true;
            loop();
        } catch(e) { alert("Camera Error"); closeCameraMode(); }
    }

    async function loop() {
        if(!isCamActive) return;
        webcam.update();
        const prediction = await model.predict(webcam.canvas);
        const status = document.getElementById('capture-status');
        let best = { className: "", probability: 0 };
        prediction.forEach(p => { if(p.probability > best.probability) best = p; });

        if(best.probability >= 0.70 && best.className !== "NO DETECTION") {
            status.innerText = "Captured: " + best.className;
            status.style.background = "var(--grass-green)";
            status.style.color = "white";
        } else {
            status.innerText = "No gesture";
            status.style.background = "none";
            status.style.color = "var(--text-navy)";
        }
        window.requestAnimationFrame(loop);
    }

    function closeCameraMode() { isCamActive = false; if(webcam) webcam.stop(); showScreen('dashboard'); }
    function askConfirmBack() { if(confirm("Go back?")) showScreen('welcome'); }
    function openGallery() { alert("Badges coming soon!"); }
</script>
</body>
</html>
