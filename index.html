<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FSL Wonder-World: Magical Adventure & Practice Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    
    <style>
        :root {
            --sky-blue: #4db8ff; --sunny-yellow: #ffdb4d; --grass-green: #5cd65c;
            --soft-white: #ffffff; --text-navy: #003366; --magic-purple: #a29bfe;
            --lava-orange: #ff7f50; --locked-gray: #dfe6e9;
            --border-beginner: #27ae60; --border-inter: #2980b9; --border-adv: #e67e22;
        }

        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            overflow: hidden; font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
            color: var(--text-navy);
        }

        /* --- DECOR --- */
        .cloud { position: absolute; background: white; border-radius: 50px; opacity: 0.8; z-index: 1; animation: moveClouds linear infinite; }
        @keyframes moveClouds { from { left: -300px; } to { left: 100vw; } }
        .island-bg { position: absolute; bottom: 0; width: 100%; height: 28vh; background: linear-gradient(to top, #2ecc71 0%, #27ae60 100%); border-radius: 50% 50% 0 0; z-index: 0; }
        .water { position: absolute; bottom: 0; width: 100%; height: 12vh; background: rgba(0, 168, 255, 0.4); z-index: 3; pointer-events: none; }

        /* --- HEADER --- */
        header { position: relative; z-index: 20; background: white; padding: 15px 0; border-bottom: 8px solid var(--sunny-yellow); text-align: center; border-radius: 0 0 40px 40px; display: flex; align-items: center; justify-content: center; gap: 20px; }
        header h1 { font-family: 'Fredoka One'; font-size: 2.5rem; margin: 0; color: var(--sky-blue); cursor: pointer; }

        .nav-label {
            font-family: 'Fredoka One'; cursor: pointer; transition: all 0.1s ease;
            text-transform: uppercase; border: none; display: inline-flex;
            align-items: center; justify-content: center;
            font-size: 1.1rem; color: var(--sky-blue); padding: 8px 15px;
            background: white; border: 3px solid var(--sky-blue); border-radius: 15px;
            box-shadow: 0 4px 0 var(--sky-blue);
        }
        .nav-label:hover { box-shadow: 0 0 15px var(--sky-blue); }
        .nav-label:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky-blue); }

        .trophy-text {
            position: absolute; right: 30px; top: 22px; font-family: 'Fredoka One'; font-size: 1.2rem;
            color: var(--text-navy); border: 4px solid var(--sunny-yellow);
            padding: 8px 20px; border-radius: 20px; background: white;
            box-shadow: 0 5px 0 var(--sunny-yellow); cursor: pointer;
        }

        /* --- SCREENS --- */
        .screen { display: none; height: calc(100vh - 120px); width: 100%; position: relative; z-index: 15; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .screen.active { display: flex !important; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- OVERLAYS --- */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
        .modal { background: white; padding: 40px; border-radius: 40px; border: 10px solid var(--sunny-yellow); max-width: 500px; text-align: center; box-shadow: 0 20px 0 rgba(0,0,0,0.2); }

        /* --- BUTTONS --- */
        .module-btn {
            background: white; border: 4px solid var(--sky-blue); padding: 15px 35px;
            border-radius: 25px; font-family: 'Fredoka One'; font-size: 1.4rem; color: var(--sky-blue);
            box-shadow: 0 8px 0 var(--sky-blue); margin: 10px; cursor: pointer; transition: 0.1s;
        }
        .module-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--sky-blue); }

        /* --- PRACTICE LAB (CAMERA FIX) --- */
        .practice-bar { margin-bottom: 15px; background: white; padding: 10px 20px; border-radius: 25px; border: 5px solid var(--magic-purple); display: flex; align-items: center; gap: 15px; box-shadow: 0 6px 0 var(--magic-purple); }
        .capture-split-container { display: flex; gap: 15px; width: 100%; max-width: 1100px; justify-content: center; flex-wrap: wrap; }
        .capture-column { flex: 1; min-width: 320px; background: white; border-radius: 35px; padding: 20px; border: 6px solid var(--sky-blue); display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        #reference-display { width: 100%; height: 300px; background: #fdfdfd; border-radius: 20px; border: 4px dashed var(--sky-blue); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #reference-img { max-width: 95%; max-height: 95%; object-fit: contain; display: none; }
        
        /* Camera Container Fix */
        #webcam-container { 
            width: 100%; 
            height: 300px; 
            background: #f0f0f0; /* Changed from black to light gray for cleaner look during load */
            border-radius: 20px; 
            overflow: hidden; 
            border: 4px solid #333; 
            position: relative;
        }
        
        /* Mirroring and Full Cover */
        #webcam-container canvas { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover; 
            transform: scaleX(-1); /* Mirrors the camera feed */
        }
        
        #capture-status { font-family: 'Fredoka One'; font-size: 2.2rem; margin-top: 15px; min-height: 60px; text-align: center; color: var(--text-navy); }
        #ref-label { margin-top: 15px; font-size: 1.8rem; font-family: 'Fredoka One'; color: var(--magic-purple); text-align: center; }
        .column-header { font-family: 'Fredoka One'; font-size: 1.8rem; margin: 0 0 15px 0; }

        /* --- PROGRESS BARS --- */
        .level-hub { display: flex; gap: 20px; width: 95%; max-width: 1100px; justify-content: center; margin-bottom: 20px; }
        .level-card { flex: 1; border-radius: 40px; padding: 25px 15px; text-align: center; cursor: pointer; border: 6px solid white; }
        #card-beginner { background: #e8f8f5; box-shadow: 0 10px 0 var(--border-beginner); }
        #card-intermediate { background: #ebf5fb; box-shadow: 0 10px 0 var(--border-inter); }
        #card-advanced { background: #fdf2e9; box-shadow: 0 10px 0 var(--border-adv); }
        .progress-container { width: 100%; background: rgba(0,0,0,0.1); border-radius: 10px; height: 15px; margin: 15px 0; overflow: hidden; border: 2px solid white; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .video-box { background:#000; border-radius:20px; overflow:hidden; width:100%; aspect-ratio:16/9; margin-bottom:10px; border:8px solid #333; }
        .answer-input { width: 200px; padding: 10px; font-size: 1.5rem; border-radius: 15px; border: 5px solid var(--sky-blue); text-align: center; font-family: 'Fredoka One'; }

    </style>
</head>
<body>

    <div id="disclaimerOverlay" class="overlay">
        <div class="modal">
            <h2 style="font-family:'Fredoka One'; color: var(--lava-orange);">IMPORTANT NOTICE</h2>
            <p id="disclaimerText" style="font-weight: bold; font-size: 1.1rem; color: var(--text-navy);"></p>
            <button class="module-btn" style="background: var(--grass-green); color: white;" onclick="confirmDisclaimer()">I UNDERSTAND</button>
        </div>
    </div>

    <div class="cloud" style="width:250px; height:70px; top:15%; animation-duration: 25s;"></div>
    <div class="island-bg"></div>
    <div class="water"></div>

    <header>
        <button class="nav-label" onclick="showScreen('welcome')">HOME</button>
        <h1>FSL Wonder-World</h1>
        <button class="trophy-text" onclick="openGallery()">AWARDS</button>
    </header>

    <div id="welcome" class="screen active">
        <div style="font-family: 'Fredoka One'; font-size: 80px; color: white; text-shadow: 6px 6px var(--sky-blue); margin-bottom: 20px; text-align: center;">WORLD MAP</div>
        <button class="module-btn" style="padding: 20px 60px; font-size: 2.5rem; background: var(--grass-green); color:white; border-color:#3d8b3d; box-shadow: 0 10px 0 #3d8b3d;" onclick="goToDashboard()">START JOURNEY</button>
    </div>

    <div id="dashboard" class="screen">
        <div class="level-hub">
            <div class="level-card" id="card-beginner" onclick="previewLevel('beginner')">
                <h3>BEGINNER</h3>
                <div class="progress-container"><div id="prog-beginner" class="progress-bar" style="background:var(--border-beginner)"></div></div>
                <div id="text-prog-beginner" style="font-weight:bold; font-size: 0.9rem;">0 PERCENT COMPLETE</div>
            </div>
            <div class="level-card" id="card-intermediate" onclick="previewLevel('intermediate')">
                <h3>INTERMEDIATE</h3>
                <div class="progress-container"><div id="prog-intermediate" class="progress-bar" style="background:var(--border-inter)"></div></div>
                <div id="text-prog-intermediate" style="font-weight:bold; font-size: 0.9rem;">0 PERCENT COMPLETE</div>
            </div>
            <div class="level-card" id="card-advanced" onclick="previewLevel('advanced')">
                <h3>ADVANCED</h3>
                <div class="progress-container"><div id="prog-advanced" class="progress-bar" style="background:var(--border-adv)"></div></div>
                <div id="text-prog-advanced" style="font-weight:bold; font-size: 0.9rem;">0 PERCENT COMPLETE</div>
            </div>
        </div>
        
        <div id="moduleSelectionArea" style="display:none; flex-direction:column; align-items:center;">
            <h2 id="currentLevelLabel" style="font-family:'Fredoka One'; color: var(--text-navy);">MISSION SELECT</h2>
            <div id="moduleList" style="display:flex; flex-wrap:wrap; justify-content:center;"></div>
            <button class="nav-label" style="margin-top:10px;" onclick="resetToLevelSelection()">BACK</button>
        </div>

        <button class="module-btn" style="background: var(--magic-purple); color: white; border-color: #8a81f3; box-shadow: 0 8px 0 #6c5ce7;" onclick="requestAccess('camera')">SIGNING CAMERA</button>
    </div>

    <div id="captureMode" class="screen">
        <div class="practice-bar">
            <span style="font-family:'Fredoka One';">COPY THIS:</span>
            <select id="signSelector" onchange="updateTargetSign()" style="padding:8px; font-family:'Quicksand'; font-weight:bold; border-radius:10px;">
                <option value="FREE">FREE PLAY</option>
            </select>
        </div>
        <div class="capture-split-container">
            <div class="capture-column">
                <h3 class="column-header" style="color:var(--magic-purple);">GOAL</h3>
                <div id="reference-display">
                    <div id="ref-text" style="font-family:'Fredoka One'; color:#ccc; text-align:center;">PICK A SIGN ABOVE</div>
                    <img src="" id="reference-img">
                </div>
                <div id="ref-label">---</div>
            </div>
            <div class="capture-column">
                <h3 class="column-header" style="color:var(--sky-blue);">YOUR CAMERA</h3>
                <div id="webcam-container"></div>
                <div id="capture-status">READY</div>
            </div>
        </div>
        <button class="module-btn" style="background:var(--lava-orange); color:white;" onclick="closeCameraMode()">EXIT CAMERA</button>
    </div>

    <div id="module" class="screen">
        <div style="background: white; border-radius: 40px; width: 95%; max-width: 1000px; padding: 20px; border: 8px solid white; box-shadow: 0 20px 40px rgba(0,0,0,0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button class="nav-label" onclick="showScreen('dashboard')">BACK TO MAP</button>
                <h2 id="moduleTitle" style="font-family:'Fredoka One'; margin:0; color: var(--sky-blue);">Lesson</h2>
                <div style="width:50px;"></div>
            </div>
            <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 15px;">
                <div class="video-box"><video id="videoPlayer" controls style="width:100%; height:100%;"></video></div>
                <div style="background: #f8fbff; border-radius: 25px; padding: 15px; display: flex; flex-direction: column; max-height: 400px;">
                    <div id="videoList" style="overflow-y: auto; flex: 1; margin-bottom: 10px;"></div>
                    <button id="quizActionBtn" class="module-btn" style="background: var(--locked-gray); color:white; margin:0;">WATCH ALL FIRST</button>
                </div>
            </div>
        </div>
    </div>

    <div id="assessment" class="screen">
        <div style="width: 90%; max-width: 600px; background: white; border-radius: 40px; padding: 25px; border: 10px solid var(--sky-blue); text-align: center;">
            <div id="livesDisplay" style="font-family:'Fredoka One'; font-size:1.8rem; color:var(--lava-orange); margin-bottom:10px;">LIVES: 3</div>
            <div class="video-box"><video id="assessmentVideo" muted controls style="width: 100%; height: 100%;"></video></div>
            <input id="answerInput" class="answer-input" placeholder="TYPE...">
            <button class="module-btn" style="background:var(--grass-green); color:white;" onclick="handleCheck()">CHECK</button>
        </div>
    </div>

    <div id="gallery" class="screen">
        <div style="width: 90%; max-width: 800px; background: white; border-radius: 40px; padding: 30px; border: 10px solid var(--sunny-yellow); text-align: center;">
            <h2 style="font-family:'Fredoka One'; color:var(--text-navy);">YOUR BADGES</h2>
            <div id="badgeGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin: 20px 0;"></div>
            <div style="margin-top: 30px; display: flex; gap: 10px; justify-content: center;">
                <button class="nav-label" onclick="showScreen('dashboard')">BACK TO MAP</button>
                <button class="module-btn" style="background: var(--lava-orange); color: white; font-size: 0.9rem;" onclick="resetProgress()">RESET ALL PROGRESS</button>
            </div>
        </div>
    </div>

<script>
    // DATA AND STATE LOGIC RETAINED
    const DATA = {
        beginner: { titles: { 1: "Alphabet", 2: "Numbers", 3: "Words" }, videoCounts: { 1: 27, 2: 10, 3: 10 }, assessments: { 1: ["A","B","C"], 2: ["1","2"], 3: ["YES","NO"] } },
        intermediate: { titles: { 1: "Emotions", 2: "Greetings" }, videoCounts: { 1: 10, 2: 10 }, assessments: { 1: ["SAD","HAPPY"], 2: ["HELLO"] } },
        advanced: { titles: { 1: "Phrases" }, videoCounts: { 1: 10 }, assessments: { 1: ["HOW ARE YOU"] } }
    };

    let state = { level: null, currentModule: null, watchedItems: new Set(), lives: 3, currentQuestionIndex: 0, randomizedSet: [] };
    let model, webcam, isCamActive = false;
    let targetSign = "FREE";
    let pendingAction = null;

    function requestAccess(type, moduleID = null) {
        const overlay = document.getElementById('disclaimerOverlay');
        const text = document.getElementById('disclaimerText');
        overlay.style.display = 'flex';
        if(type === 'camera') {
            text.innerText = "THE SIGNING CAMERA REQUIRES GOOD LIGHTING AND A CLEAR BACKGROUND FOR BETTER ACCURACY.";
            pendingAction = () => openCameraMode();
        } else if(type === 'lesson') {
            text.innerText = "YOU ARE ENTERING A LEARNING MISSION. WATCH EVERY VIDEO CAREFULLY TO UNLOCK THE QUIZ.";
            pendingAction = () => startTraining(moduleID);
        } else if(type === 'quiz') {
            text.innerText = "WARNING: YOU ONLY HAVE 3 LIVES FOR THIS QUIZ. IF YOU FAIL, YOU MUST RESTART THE ASSESSMENT.";
            pendingAction = () => startQuiz();
        }
    }

    function confirmDisclaimer() {
        document.getElementById('disclaimerOverlay').style.display = 'none';
        if(pendingAction) { pendingAction(); pendingAction = null; }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'dashboard') updateDashboardStats();
    }

    function getSave() { return JSON.parse(localStorage.getItem("fsl_save_v1")) || { beginner: {}, intermediate: {}, advanced: {} }; }

    function resetProgress() {
        if(confirm("ARE YOU SURE? THIS WILL DELETE ALL YOUR EARNED BADGES AND PROGRESS.")){
            localStorage.removeItem("fsl_save_v1");
            updateDashboardStats();
            openGallery();
        }
    }

    function updateDashboardStats() {
        const s = getSave();
        ['beginner', 'intermediate', 'advanced'].forEach(lvl => {
            const finished = Object.keys(s[lvl]).length;
            const total = Object.keys(DATA[lvl].titles).length;
            const percentage = Math.round((finished / total) * 100) || 0;
            const prog = document.getElementById(`prog-${lvl}`);
            const textProg = document.getElementById(`text-prog-${lvl}`);
            if(prog) prog.style.width = percentage + "%";
            if(textProg) textProg.innerText = percentage + " PERCENT COMPLETE";
        });
    }

    async function openCameraMode() {
        showScreen('captureMode');
        document.getElementById('capture-status').innerText = "STARTING";
        try {
            if(!model) {
                model = await tmImage.load("./model.json", "./metadata.json");
                const selector = document.getElementById('signSelector');
                model.getClassLabels().forEach(label => {
                    if(label !== "NO DETECTION" && !label.toLowerCase().includes("background")) {
                        let opt = document.createElement('option');
                        opt.value = label; opt.innerText = label;
                        selector.appendChild(opt);
                    }
                });
            }
            if(!webcam) {
                // TM webcam setup
                webcam = new tmImage.Webcam(448, 448, true); 
                await webcam.setup();
                document.getElementById("webcam-container").innerHTML = "";
                document.getElementById("webcam-container").appendChild(webcam.canvas);
            }
            await webcam.play();
            isCamActive = true;
            window.requestAnimationFrame(loopCapture);
        } catch(e) { alert("Camera error: " + e); showScreen('dashboard'); }
    }

    function updateTargetSign() {
        targetSign = document.getElementById('signSelector').value;
        const img = document.getElementById('reference-img');
        const text = document.getElementById('ref-text');
        const label = document.getElementById('ref-label');
        if(targetSign === "FREE") {
            img.style.display = "none"; text.style.display = "block"; label.innerText = "---";
        } else {
            img.src = `reference_images/${targetSign}.jpg`;
            img.style.display = "block"; text.style.display = "none";
            label.innerText = "GOAL: " + targetSign.toUpperCase();
        }
    }

    async function loopCapture() {
        if(!isCamActive) return;
        webcam.update();
        const prediction = await model.predict(webcam.canvas);
        let best = { className: "", probability: 0 };
        prediction.forEach(p => { if(p.probability > best.probability) best = p; });
        const status = document.getElementById('capture-status');
        if(targetSign === "FREE") {
            status.innerText = best.probability > 0.8 ? "SIGN: " + best.className : "WAITING";
            status.style.color = best.probability > 0.8 ? "var(--grass-green)" : "var(--text-navy)";
        } else {
            const isMatch = (best.className === targetSign && best.probability > 0.8);
            status.innerText = isMatch ? "MATCH FOUND!" : "TRY " + targetSign;
            status.style.color = isMatch ? "var(--grass-green)" : "var(--lava-orange)";
        }
        window.requestAnimationFrame(loopCapture);
    }

    function closeCameraMode() { isCamActive = false; if(webcam) webcam.stop(); showScreen('dashboard'); }

    // PREVIEW, TRAINING, QUIZ, AND GALLERY LOGIC RETAINED
    function previewLevel(lvl) {
        state.level = lvl;
        document.querySelector('.level-hub').style.display = 'none';
        document.getElementById('moduleSelectionArea').style.display = 'flex';
        document.getElementById('currentLevelLabel').innerText = lvl.toUpperCase();
        const list = document.getElementById('moduleList'); list.innerHTML = "";
        Object.keys(DATA[lvl].titles).forEach(mId => {
            const btn = document.createElement("button");
            btn.className = "module-btn"; btn.innerText = DATA[lvl].titles[mId];
            btn.onclick = () => requestAccess('lesson', mId);
            list.appendChild(btn);
        });
    }

    function resetToLevelSelection() {
        document.querySelector('.level-hub').style.display = 'flex';
        document.getElementById('moduleSelectionArea').style.display = 'none';
    }

    function startTraining(m) {
        state.currentModule = m; state.watchedItems = new Set();
        showScreen('module');
        document.getElementById("moduleTitle").innerText = DATA[state.level].titles[m];
        const list = document.getElementById("videoList"); list.innerHTML = "";
        const qBtn = document.getElementById("quizActionBtn");
        qBtn.style.background = "var(--locked-gray)";
        qBtn.innerText = "WATCH ALL FIRST";
        const folder = (state.level === 'advanced' ? 'hard' : state.level);
        for(let i=1; i<=DATA[state.level].videoCounts[m]; i++) {
            const item = document.createElement("div");
            item.style = "background:white; margin-bottom:5px; padding:10px; border-radius:10px; border:2px solid #eee; cursor:pointer;";
            item.innerHTML = `Lesson ${i} <small id="vstat-${i}"></small>`;
            item.onclick = () => {
                document.getElementById("videoPlayer").src = `videos/${folder}/module${m}_video${i}.mp4`;
                document.getElementById("videoPlayer").play();
                document.getElementById(`vstat-${i}`).innerText = "FINISHED";
                state.watchedItems.add(i);
                if(state.watchedItems.size >= DATA[state.level].videoCounts[m]) {
                    qBtn.style.background = "var(--sunny-yellow)"; 
                    qBtn.onclick = () => requestAccess('quiz');
                    qBtn.innerText = "START QUIZ";
                }
            };
            list.appendChild(item);
        }
    }

    function startQuiz() {
        state.lives = 3; state.currentQuestionIndex = 0;
        const pool = DATA[state.level].assessments[state.currentModule];
        state.randomizedSet = pool.map((a, i) => ({ answer: a, vid: i+1 })).sort(() => 0.5 - Math.random());
        updateLivesDisplay(); loadQuestion(); showScreen('assessment');
    }

    function loadQuestion() {
        const q = state.randomizedSet[state.currentQuestionIndex];
        const folder = (state.level === 'advanced' ? 'hard' : state.level);
        document.getElementById("assessmentVideo").src = `videos/${folder}/module${state.currentModule}_test${q.vid}.mp4`;
        document.getElementById("assessmentVideo").play();
        document.getElementById("answerInput").value = "";
    }

    function updateLivesDisplay() { document.getElementById("livesDisplay").innerText = "LIVES: " + state.lives; }

    function handleCheck() {
        const input = document.getElementById("answerInput").value.trim().toUpperCase();
        if(input === state.randomizedSet[state.currentQuestionIndex].answer) {
            confetti({ particleCount: 100 });
            state.currentQuestionIndex++;
            if(state.currentQuestionIndex >= state.randomizedSet.length) {
                const save = getSave(); save[state.level][state.currentModule] = true;
                localStorage.setItem("fsl_save_v1", JSON.stringify(save));
                openGallery();
            } else { setTimeout(loadQuestion, 500); }
        } else {
            state.lives--; updateLivesDisplay();
            if(state.lives <= 0) { alert("OUT OF LIVES! TRY AGAIN."); showScreen('dashboard'); }
        }
    }

    function openGallery() {
        showScreen('gallery');
        const grid = document.getElementById("badgeGrid"); const save = getSave(); grid.innerHTML = "";
        ['beginner', 'intermediate', 'advanced'].forEach(lvl => {
            Object.keys(DATA[lvl].titles).forEach(mId => {
                grid.innerHTML += `<div style="background:#f9f9f9; padding:15px; border-radius:20px; border:3px dashed #ddd; opacity:${save[lvl][mId] ? 1 : 0.4}">${DATA[lvl].titles[mId]} ${save[lvl][mId] ? '(EARNED)' : '(LOCKED)'}</div>`;
            });
        });
    }
    
    function goToDashboard() { showScreen('dashboard'); resetToLevelSelection(); }
    updateDashboardStats();
</script>
</body>
</html>
