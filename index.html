<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FSL Wonder-World: LCD Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    
    <style>
        :root {
            --sky-blue: #4db8ff; --sunny-yellow: #ffdb4d; --grass-green: #5cd65c;
            --text-navy: #003366; --magic-purple: #a29bfe; --lava-orange: #ff7f50;
            --locked-gray: #dfe6e9;
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh; width: 100vw;
            overflow-x: hidden; overflow-y: auto; 
            font-family: 'Quicksand', sans-serif;
            background: #E0F7FA; color: var(--text-navy);
        }

        header { 
            position: sticky; top: 0; z-index: 100; background: white; 
            padding: 10px; border-bottom: 5px solid var(--sunny-yellow); 
            display: flex; align-items: center; justify-content: space-between;
        }

        .screen { 
            display: none; padding: 15px; box-sizing: border-box; 
            width: 100%; min-height: calc(100vh - 70px); 
            flex-direction: column; align-items: center;
        }
        .screen.active { display: flex; }

        .app-window { 
            background: white; border-radius: 25px; width: 100%; 
            max-width: 1000px; border: 5px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .video-tv { background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 16/9; width: 100%; }
        
        .module-btn { 
            background: white; border: 3px solid var(--sky-blue); padding: 15px; 
            border-radius: 20px; font-family: 'Fredoka One'; font-size: 1.1rem; 
            cursor: pointer; box-shadow: 0 5px 0 var(--sky-blue); margin: 5px;
            user-select: none; /* Prevents text selection on long press */
        }

        .lesson-item {
            padding: 12px; border-radius: 15px; border: 2px solid #eee; margin-bottom: 8px;
            display: flex; justify-content: space-between; background: white; font-weight: bold;
        }
        .lesson-item.watched { border-color: var(--grass-green); background: #f0fff0; }

        #assessmentBtn.ready { 
            background: var(--sunny-yellow) !important; 
            color: var(--text-navy) !important; 
            box-shadow: 0 5px 0 #d4af37 !important; 
            cursor: pointer !important;
        }

        /* Quiz Box */
        .quiz-box {
            background: white; padding: 20px; border-radius: 30px; border: 8px solid var(--sky-blue);
            width: 90%; max-width: 600px; text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div onclick="showScreen('dashboard')" style="font-size: 35px; cursor: pointer;">🦁</div>
        <h1 style="font-family:'Fredoka One'; color: var(--sky-blue); font-size: 1.2rem; margin:0;">FSL WONDER-WORLD</h1>
        <div style="font-size: 30px;">🏆</div>
    </header>

    <div id="dashboard" class="screen active">
        <div id="levelSelection" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%;">
            <button class="module-btn" onclick="loadModules('beginner')">🏔️ BEGINNER</button>
            <button class="module-btn" onclick="loadModules('intermediate')">🌊 INTER</button>
            <button class="module-btn" onclick="loadModules('advanced')">🚀 ADVANCED</button>
            <button class="module-btn" style="background:var(--magic-purple); color:white;" onclick="showScreen('captureMode')">📷 CAMERA</button>
        </div>
        <div id="moduleList" style="margin-top:20px; display:none; width:100%;"></div>
    </div>

    <div id="trainingScreen" class="screen">
        <div class="app-window">
            <div style="padding:15px;">
                <div class="video-tv"><video id="videoPlayer" controls style="width:100%; height:100%;"></video></div>
                <h3 id="trainTitle" style="text-align:center;">Lesson</h3>
                <div id="lessonList" style="max-height: 200px; overflow-y: auto; margin: 10px 0;"></div>
                <button id="assessmentBtn" class="module-btn" style="width:100%; background:var(--locked-gray); color:#999;" disabled>WATCH ALL TO START ⭐</button>
                <button class="module-btn" style="width:100%; border-color:#ccc;" onclick="showScreen('dashboard')">◀ BACK TO MAP</button>
            </div>
        </div>
    </div>

    <div id="quizScreen" class="screen">
        <div class="quiz-box">
            <h2 style="font-family:'Fredoka One'; color:var(--text-navy);">QUIZ TIME!</h2>
            <div class="video-tv" style="margin-bottom:15px;"><video id="quizVideo" controls style="width:100%; height:100%;"></video></div>
            <input type="text" id="quizInput" placeholder="Type sign here..." style="width:80%; padding:15px; border-radius:15px; border:3px solid var(--sky-blue); font-size:1.2rem; text-align:center;">
            <br><br>
            <button class="module-btn" style="background:var(--grass-green); color:white; width:80%;" onclick="checkQuizAnswer()">SUBMIT ANSWER</button>
        </div>
    </div>

    <div id="captureMode" class="screen">
        <div class="app-window" style="padding:20px; text-align:center;">
            <div id="webcam-container" style="width:280px; height:280px; margin:0 auto; background:#000; border-radius:20px; overflow:hidden;"></div>
            <div id="capture-status" style="font-family:'Fredoka One'; margin-top:15px; padding:10px; border-radius:15px; font-size:1.5rem;">No gesture</div>
            <button class="module-btn" style="background:var(--lava-orange); color:white;" onclick="location.reload()">CLOSE CAMERA</button>
        </div>
    </div>

<script>
    const DATA = {
        beginner: { 1: "Alphabet ABCs", 2: "Numbers 1-10", 3: "Basic Words" },
        intermediate: { 1: "Emotions", 2: "Greetings", 3: "Polite Expressions" },
        advanced: { 1: "Basic Phrases" }
    };
    const VIDEO_COUNTS = { beginner: { 1: 27, 2: 10, 3: 10 }, intermediate: { 1: 10, 2: 10, 3: 10 }, advanced: { 1: 10 } };

    let state = { level: '', module: 0, watched: new Set() };
    let model, webcam;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'captureMode') startCamera();
    }

    function loadModules(lvl) {
        state.level = lvl;
        const list = document.getElementById('moduleList');
        list.innerHTML = `<h2 style="text-align:center">${lvl.toUpperCase()}</h2>`;
        Object.keys(DATA[lvl]).forEach(id => {
            const btn = document.createElement('button');
            btn.className = 'module-btn';
            btn.style.width = '100%';
            btn.innerText = DATA[lvl][id];
            btn.onclick = () => startTraining(id);
            list.appendChild(btn);
        });
        document.getElementById('levelSelection').style.display = 'none';
        list.style.display = 'block';
    }

    function startTraining(modId) {
        state.module = modId;
        state.watched = new Set();
        document.getElementById('trainTitle').innerText = DATA[state.level][modId];
        const list = document.getElementById('lessonList');
        list.innerHTML = "";
        
        const count = VIDEO_COUNTS[state.level][modId];
        for(let i=1; i<=count; i++) {
            const div = document.createElement('div');
            div.className = 'lesson-item';
            div.id = `item-${i}`;
            div.innerHTML = `<span>Lesson ${i}</span> <span class="status">⚪</span>`;
            div.onclick = () => {
                const folder = state.level === 'advanced' ? 'hard' : state.level;
                document.getElementById('videoPlayer').src = `videos/${folder}/module${modId}_video${i}.mp4`;
                document.getElementById('videoPlayer').play();
                
                state.watched.add(i);
                div.classList.add('watched');
                div.querySelector('.status').innerText = "✅";
                updateQuizButton(count);
            };
            list.appendChild(div);
        }
        
        // Setup Quiz Button
        const qBtn = document.getElementById('assessmentBtn');
        qBtn.disabled = true;
        qBtn.innerText = "WATCH ALL TO START ⭐";
        qBtn.classList.remove('ready');

        // HIDDEN FEATURE: Long press 3 seconds to force unlock if Pi fails
        let pressTimer;
        qBtn.onmousedown = () => { pressTimer = window.setTimeout(() => { unlockQuiz(); }, 3000); };
        qBtn.onmouseup = () => { clearTimeout(pressTimer); };
        qBtn.ontouchstart = () => { pressTimer = window.setTimeout(() => { unlockQuiz(); }, 3000); };
        qBtn.ontouchend = () => { clearTimeout(pressTimer); };

        showScreen('trainingScreen');
    }

    function updateQuizButton(total) {
        const qBtn = document.getElementById('assessmentBtn');
        if(state.watched.size >= total) {
            unlockQuiz();
        } else {
            qBtn.innerText = `${state.watched.size}/${total} WATCHED`;
        }
    }

    function unlockQuiz() {
        const qBtn = document.getElementById('assessmentBtn');
        qBtn.disabled = false;
        qBtn.classList.add('ready');
        qBtn.innerText = "START QUIZ NOW! 🏆";
        qBtn.onclick = () => {
            const folder = state.level === 'advanced' ? 'hard' : state.level;
            // Load the first quiz video
            document.getElementById('quizVideo').src = `videos/${folder}/module${state.module}_test1.mp4`;
            showScreen('quizScreen');
            document.getElementById('quizVideo').play();
        };
    }

    function checkQuizAnswer() {
        alert("Great job! Badge earned! 🏆");
        showScreen('dashboard');
        location.reload(); // Reset for next mission
    }

    // CAMERA LOGIC
    async function startCamera() {
        const status = document.getElementById('capture-status');
        try {
            if(!model) model = await tmImage.load("./model.json", "./metadata.json");
            if(!webcam) {
                webcam = new tmImage.Webcam(280, 280, true);
                await webcam.setup();
                document.getElementById("webcam-container").appendChild(webcam.canvas);
            }
            webcam.play();
            predictLoop();
        } catch(e) { alert("Camera failed"); }
    }

    async function predictLoop() {
        webcam.update();
        const pred = await model.predict(webcam.canvas);
        let best = { className: "", probability: 0 };
        pred.forEach(p => { if(p.probability > best.probability) best = p; });

        const status = document.getElementById('capture-status');
        if(best.probability >= 0.70 && best.className !== "NO DETECTION") {
            status.innerText = "CAPTURED: " + best.className;
            status.style.background = "var(--grass-green)";
            status.style.color = "white";
        } else {
            status.innerText = "No gesture";
            status.style.background = "none";
            status.style.color = "var(--text-navy)";
        }
        window.requestAnimationFrame(predictLoop);
    }
</script>
</body>
</html>
